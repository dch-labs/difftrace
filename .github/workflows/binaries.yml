name: Binaries

on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Build linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --all-features

      - name: Package
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          cd target/release
          tar -czf "difftrace-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" difftrace

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          ASSET="target/release/difftrace-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Built from the tagged commit." "$ASSET" ||
              gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly --title "nightly" --prerelease --notes "Rolling build from master."
            gh release upload nightly "$ASSET"
          fi
