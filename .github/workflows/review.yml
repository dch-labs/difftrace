# The difftrace review workflow. It runs on this repository's own pull
# requests, and consumer repositories call it as a reusable workflow
# through the caller template in examples/difftrace-review.yml — pinned
# to a fixed commit of this repository, so the binary version+checksum
# pins below always travel with the workflow the consumer runs. On
# every difftrace release, release.sh pins bumps those pins.
name: difftrace review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true
      model:
        description: "Model to review with"
        required: false
  workflow_call:
    inputs:
      pr:
        description: "Pull request number to review"
        type: string
        required: false
      model:
        description: "Model to review with"
        type: string
        required: false
    secrets:
      ZAI_API_KEY:
        required: true
      DIFFTRACE_APP_ID:
        required: true
      DIFFTRACE_APP_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Review the pull request
    runs-on: ubuntu-latest
    concurrency:
      # One review lane per pull request: a push supersedes any review
      # still in flight or queued for the same PR — the superseded run
      # would only re-review an older head, so cancelling it saves the
      # duplicate spend. Comment commands have their own serialized lane
      # in the chat job and may interleave with a review.
      group: difftrace-review-${{ inputs.pr || github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.fork != true)
    steps:
      - name: Resolve the pull request number and head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          case "$sha" in ''|*[!0-9a-f]*) echo "invalid head sha: $sha" >&2; exit 1;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Reject fork pull requests
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          fork=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.fork)
          case "$fork" in false) ;; *) echo "difftrace does not run on fork pull requests" >&2; exit 1;; esac

      # The binary is pinned to the tagged v0.11.0 release; bump version and
      # checksum together on every difftrace release.
      - name: Install difftrace v0.11.0
        run: |
          curl -fsSL -o /tmp/difftrace.tar.gz \
            https://github.com/dch-labs/difftrace/releases/download/v0.11.0/difftrace-0.11.0-x86_64-unknown-linux-gnu.tar.gz
          echo "8ede6c7eabf92c6ebc81f50e55acb7466a8146a9cc032c97d3fa23dc1f9e8b25  /tmp/difftrace.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/difftrace.tar.gz -C "$HOME/.local/bin"

      - name: Check the required secrets are present
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
          DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
        run: |
          : "${ZAI_API_KEY:?ZAI_API_KEY is not set - the review step would fail opaquely}"
          : "${DIFFTRACE_APP_ID:?DIFFTRACE_APP_ID is not set - the review step would fail opaquely}"
          : "${DIFFTRACE_APP_PRIVATE_KEY:?DIFFTRACE_APP_PRIVATE_KEY is not set - the review step would fail opaquely}"

      - name: Mint the difftrace app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.DIFFTRACE_APP_ID }}
          private-key: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Restore the review memory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.difftrace/memory
          key: difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-${{ steps.pr.outputs.sha }}
          restore-keys: |
            difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-

      - name: Review the pull request
        run: |
          difftrace review --repo "$REPO" --pr "$PR" --sha "$SHA" --memory "$HOME/.difftrace/memory/learnings.md"
        env:
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.pr.outputs.sha }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_PROFILE: zai
          DIFFTRACE_MAX_TOKENS: '65536'
          DIFFTRACE_STREAM_TIMEOUT_SECS: '900'
          DIFFTRACE_BATCH_FILES: '100'
          DIFFTRACE_MODEL: ${{ inputs.model || vars.DIFFTRACE_MODEL || 'glm-4.7' }}
          RUST_LOG: info

      - name: Upload trajectory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: difftrace-trajectory-pr${{ steps.pr.outputs.pr }}
          path: ~/.difftrace/trajectories/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  gate:
    name: Authorize a difftrace command
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      (github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null)) &&
      !endsWith(github.event.comment.user.login, '[bot]')
    outputs:
      skip: ${{ steps.cmd.outputs.skip }}
      verb: ${{ steps.cmd.outputs.verb }}
    steps:
      # A comment triggers difftrace only when its first line addresses
      # the bot — quoted mentions deeper in the body never fire.
      - name: Resolve the command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          case "$AUTHOR" in *"[bot]") echo "skip=bot" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if ! printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]'; then
            echo "skip=mention" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"
          if printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]+review([[:space:]]|$)'; then
            echo "verb=review" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$BODY" | head -n 1 | grep -qiE '^(@difftrace(\[bot\])?|/difftrace)[[:space:]]+plan([[:space:]]|$)'; then
            echo "verb=plan" >> "$GITHUB_OUTPUT"
          else
            echo "verb=reply" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorize the command author
        if: steps.cmd.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.comment.user.login }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          case "$AUTHOR" in *[!A-Za-z0-9-]*) echo "invalid comment author login: $AUTHOR" >&2; exit 1;; esac
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission)
          case "$perm" in admin|write) ;; *) echo "$AUTHOR ($perm) may not trigger difftrace" >&2; exit 1;; esac
          fork=$(gh api "repos/$REPO/pulls/$PR" --jq .head.repo.fork)
          case "$fork" in false) ;; *) echo "difftrace does not run on fork pull requests" >&2; exit 1;; esac

  chat:
    name: Handle a difftrace command
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      # One command lane per pull request, serialized: comment commands
      # never race each other on the registry, threads, and memory.
      # Reviews run in their own lane and may interleave with a command;
      # a push supersedes an in-flight review instead of queueing behind
      # it. GitHub holds at most one running and one pending run per
      # lane, so a third rapid command replaces the pending one.
      # A `review` command joins the review lane instead and, as the
      # incoming run, cancels the in-flight review there — latest intent
      # wins.
      group: ${{ needs.gate.outputs.verb == 'review' && format('difftrace-review-{0}', github.event.pull_request.number || github.event.issue.number || github.run_id) || format('difftrace-chat-{0}', github.event.pull_request.number || github.event.issue.number || github.run_id) }}
      cancel-in-progress: ${{ needs.gate.outputs.verb == 'review' }}
    if: needs.gate.outputs.skip == ''
    steps:

      - name: Resolve the pull request number and head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number: $PR" >&2; exit 1;; esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          case "$sha" in ''|*[!0-9a-f]*) echo "invalid head sha: $sha" >&2; exit 1;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The binary is pinned to the tagged v0.11.0 release; bump version and
      # checksum together on every difftrace release.
      - name: Install difftrace v0.11.0
        run: |
          curl -fsSL -o /tmp/difftrace.tar.gz \
            https://github.com/dch-labs/difftrace/releases/download/v0.11.0/difftrace-0.11.0-x86_64-unknown-linux-gnu.tar.gz
          echo "8ede6c7eabf92c6ebc81f50e55acb7466a8146a9cc032c97d3fa23dc1f9e8b25  /tmp/difftrace.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/difftrace.tar.gz -C "$HOME/.local/bin"

      - name: Check the required secrets are present
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
          DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
        run: |
          : "${ZAI_API_KEY:?ZAI_API_KEY is not set - the reply step would fail opaquely}"
          : "${DIFFTRACE_APP_ID:?DIFFTRACE_APP_ID is not set - the reply step would fail opaquely}"
          : "${DIFFTRACE_APP_PRIVATE_KEY:?DIFFTRACE_APP_PRIVATE_KEY is not set - the reply step would fail opaquely}"

      - name: Mint the difftrace app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ secrets.DIFFTRACE_APP_ID }}
          private-key: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Restore the review memory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.difftrace/memory
          key: difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-${{ steps.pr.outputs.sha }}
          restore-keys: |
            difftrace-mem-${{ github.repository }}-pr${{ steps.pr.outputs.pr }}-

      - name: Run the command
        run: |
          if [ "$VERB" = "review" ]; then
            difftrace review --repo "$REPO" --pr "$PR" --sha "$SHA" --memory "$HOME/.difftrace/memory/learnings.md"
          elif [ "$VERB" = "plan" ] && [ "$COMMENT_KIND" = "review" ]; then
            difftrace plan --repo "$REPO" --pr "$PR" --sha "$SHA" --review-comment "$COMMENT_ID"
          elif [ "$VERB" = "plan" ] && [ "$COMMENT_KIND" = "issue" ]; then
            gh pr comment "$PR" --repo "$REPO" --body '`plan` plans a fix for a review-thread finding — answering as a generic reply; use `@difftrace review` for a fresh full review.'
            difftrace reply --repo "$REPO" --pr "$PR" --sha "$SHA" --issue-comment "$COMMENT_ID"
          elif [ "$COMMENT_KIND" = "issue" ]; then
            difftrace reply --repo "$REPO" --pr "$PR" --sha "$SHA" --issue-comment "$COMMENT_ID"
          else
            difftrace reply --repo "$REPO" --pr "$PR" --sha "$SHA" --review-comment "$COMMENT_ID"
          fi
        env:
          VERB: ${{ needs.gate.outputs.verb }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_KIND: ${{ github.event_name == 'issue_comment' && 'issue' || 'review' }}
          PR: ${{ steps.pr.outputs.pr }}
          SHA: ${{ steps.pr.outputs.sha }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DIFFTRACE_PROFILE: zai
          DIFFTRACE_MAX_TOKENS: '65536'
          DIFFTRACE_STREAM_TIMEOUT_SECS: '900'
          DIFFTRACE_BATCH_FILES: '100'
          DIFFTRACE_MODEL: ${{ inputs.model || vars.DIFFTRACE_MODEL || 'glm-4.7' }}
          RUST_LOG: info

      - name: Upload trajectory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: difftrace-trajectory-pr${{ steps.pr.outputs.pr }}-chat
          path: ~/.difftrace/trajectories/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
