# The difftrace review workflow, called by consumer repositories:
#   uses: dch-labs/difftrace/.github/workflows/review.yml@v0.12
# The ref is a moving tag — release.yml moves it to every v0.12.x
# release, so callers track the release train by bumping major/minor
# only. The workflow runs the hosted binary (review --repo --pr
# --actor) against the caller's pull request with a least-privilege
# app token; the binary authorizes the comment author before any
# spend, reads the cross-round state from the standing difftrace
# comment, and posts one review per round.
name: difftrace review

on:
  workflow_call:
    inputs:
      pr:
        description: "Pull request number; defaults to the event's pull request or issue"
        type: string
        required: false
      actor:
        description: "Login to authorize (the comment author); defaults to the event actor"
        type: string
        required: false
    secrets:
      ZAI_API_KEY:
        required: true
      DIFFTRACE_APP_ID:
        required: true
      DIFFTRACE_APP_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: Review the pull request
    runs-on: ubuntu-latest
    concurrency:
      # One review lane per pull request: a push supersedes any review
      # still in flight for the same PR — it would only re-review an
      # older head.
      group: difftrace-review-${{ inputs.pr || github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       !endsWith(github.event.comment.user.login, '[bot]') &&
       startsWith(github.event.comment.body, '/review')) ||
      (github.event_name == 'pull_request_review_comment' &&
       !endsWith(github.event.comment.user.login, '[bot]') &&
       startsWith(github.event.comment.body, '/review'))
    steps:
      - name: Mint the difftrace app token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.DIFFTRACE_APP_ID }}
          private-key: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Reject fork pull requests (fail closed)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          case "$PR" in ''|*[!0-9]*) echo "::error::invalid pull request number: $PR" >&2; exit 1;; esac
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FORK="$HEAD_FORK"
          else
            OWNER=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRepositoryOwner --jq .headRepositoryOwner.login)
            if [ "$OWNER" = "$REPO_OWNER" ]; then FORK=false; else FORK=true; fi
          fi
          case "$FORK" in
            false) ;;
            *) echo "::error::fork pull requests are not reviewed: the app token must not read external code (saw fork=$FORK)" >&2; exit 1 ;;
          esac

      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', inputs.pr || github.event.pull_request.number || github.event.issue.number) }}
          persist-credentials: false

      - name: Install the difftrace binary from the moving tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p ~/.local/bin
          gh release download v0.12 --repo dch-labs/difftrace \
            --pattern 'difftrace-*-x86_64-unknown-linux-gnu.tar.gz*' --dir /tmp/difftrace-install
          cd /tmp/difftrace-install
          sha256sum -c difftrace-*-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf difftrace-*-x86_64-unknown-linux-gnu.tar.gz
          install -m 0755 difftrace ~/.local/bin/difftrace
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the review
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          RUST_LOG: info
          PR: ${{ inputs.pr || github.event.pull_request.number || github.event.issue.number }}
          ACTOR: ${{ inputs.actor || github.event.comment.user.login || github.actor }}
        run: |
          difftrace review \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR" \
            --actor "$ACTOR"
