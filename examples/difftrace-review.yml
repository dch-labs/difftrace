# Caller template for the difftrace review workflow.
# Copy verbatim into the consumer repository. The uses: ref below pins
# the MOVING tag v0.12 — release.yml in the difftrace repo moves it to
# every v0.12.x release, so this file changes only on a major/minor
# bump of difftrace. Never pin a commit sha or a patch version here.
#
# Required repository secrets (fail fast if missing):
#   ZAI_API_KEY               the judge provider key
#   DIFFTRACE_APP_ID          the difftrace GitHub App id
#   DIFFTRACE_APP_PRIVATE_KEY the difftrace GitHub App private key
# The app needs pull-requests write + contents read on this repository.
name: difftrace review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        required: true

permissions: {}

jobs:
  review:
    name: difftrace
    # Fork pull requests are rejected callee-side before any
    # checkout: pull_request events read the payload flag, and
    # comment events (which GitHub fires for fork contributors
    # commenting on the base repository's pull request too) resolve
    # the pull request and compare head owner to base owner first.
    uses: dch-labs/difftrace/.github/workflows/review.yml@v0.12 # bump major/minor only
    with:
      pr: ${{ inputs.pr || github.event.pull_request.number || github.event.issue.number }}
      actor: ${{ github.event.comment.user.login || github.actor }}
    secrets:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      DIFFTRACE_APP_ID: ${{ secrets.DIFFTRACE_APP_ID }}
      DIFFTRACE_APP_PRIVATE_KEY: ${{ secrets.DIFFTRACE_APP_PRIVATE_KEY }}
