[package]
name = "difftrace"
version = "0.12.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A diff-review agent with a contractual model of truth"
repository = "https://github.com/dch-labs/difftrace"
homepage = "https://github.com/dch-labs/difftrace"
keywords = ["code-review", "github", "llm", "agent"]
categories = ["development-tools"]
readme = "README.md"
rust-version = "1.98"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
