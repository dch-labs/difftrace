[package]
name = "difftrace"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "An AI pull-request reviewer for GitHub, built on loopctl"
repository = "https://github.com/dch-labs/difftrace"
homepage = "https://github.com/dch-labs/difftrace"
keywords = ["code-review", "github", "llm", "agent"]
categories = ["development-tools"]
readme = "README.md"
rust-version = "1.98"

[lib]
name = "difftrace"
path = "src/lib.rs"

[[bin]]
name = "difftrace"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
loopctl = { git = "https://github.com/dch-labs/loopctl", features = ["anthropic", "openai", "streaming", "testing", "zai"] }
octocrab = "0.54"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
match_same_arms = "deny"
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
let_underscore_must_use = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
